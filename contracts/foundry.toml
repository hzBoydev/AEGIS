[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Reproducible builds: pin compiler & target EVM (jangan ikut versi forge lokal).
solc = "0.8.35"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 64 }

[fuzz]
runs = 512
